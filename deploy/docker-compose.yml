# EC2 한 대에 앱 + PostgreSQL + Caddy(HTTPS 자동 인증서)를 함께 띄웁니다.
# 사용법은 deploy/README.md. 비밀값은 같은 폴더의 .env (git에 올리지 않음)
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: hangajiman
      POSTGRES_USER: hangajiman
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD를 .env에 넣어 주세요}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangajiman -d hangajiman"]
      interval: 5s
      retries: 10

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:postgresql://db:5432/hangajiman
      DB_USERNAME: hangajiman
      # 메모리 1GB 서버(t4g.micro)에서도 버티도록 자바 메모리 상한. 2GB 이상이면 지워도 됩니다
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xmx384m -XX:MaxMetaspaceSize=160m -Xss512k}

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN을 .env에 넣어 주세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:
