spring.application.name=backend
server.port=8080

# DB: 로컬 PostgreSQL 기본값. 다르면 환경변수 DB_URL, DB_USERNAME, DB_PASSWORD로 바꾸세요.
# Homebrew로 설치한 PostgreSQL은 OS 사용자 이름으로 비밀번호 없이 접속됩니다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hangajiman}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

# 테이블은 Flyway(src/main/resources/db/migration)로만 만들고, JPA는 엔티티와 테이블이 맞는지만 검사합니다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT: 아래 secret 기본값은 로컬 개발용입니다. 배포 서버에서는 반드시 환경변수 JWT_SECRET(32바이트 이상)으로 바꾸세요.
# 생성 예: openssl rand -base64 32
jwt.secret=${JWT_SECRET:hangajiman-local-dev-only-secret-key-change-me}
jwt.access-exp-seconds=${JWT_ACCESS_EXP_SECONDS:1800}
jwt.refresh-exp-days=${JWT_REFRESH_EXP_DAYS:14}

# 소셜 로그인
# KAKAO_ADMIN_KEY: 탈퇴 시 카카오 연결 끊기에 필요 (없으면 연결 끊기만 건너뜀)
# GOOGLE_CLIENT_IDS: 앱의 Google OAuth 클라이언트 ID (Android·iOS·웹은 쉼표로 구분). 없으면 Google 로그인 불가
kakao.api-base-url=https://kapi.kakao.com
kakao.admin-key=${KAKAO_ADMIN_KEY:}
google.tokeninfo-url=https://oauth2.googleapis.com/tokeninfo
google.client-ids=${GOOGLE_CLIENT_IDS:}

# 친구 초대 링크 앞부분. 🟡 실제 도메인(App Links / Universal Links)이 정해지면 환경변수 INVITE_BASE_URL로 바꾸세요.
friend.invite-base-url=${INVITE_BASE_URL:http://localhost:8080}

# Expo 푸시 (NOTI-01). EXPO_ACCESS_TOKEN은 Expo의 강화된 푸시 보안을 켰을 때만 필요
expo.push-url=${EXPO_PUSH_URL:https://exp.host/--/api/v2/push/send}
expo.access-token=${EXPO_ACCESS_TOKEN:}

# 비밀번호 찾기 인증코드 메일 (SMTP). SPRING_MAIL_HOST가 없으면 메일 대신 서버 로그에 코드를 찍습니다.
# 예: Gmail → SPRING_MAIL_HOST=smtp.gmail.com, SPRING_MAIL_PORT=587, SPRING_MAIL_USERNAME=보내는주소, SPRING_MAIL_PASSWORD=앱 비밀번호
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.timeout=5000
mail.from=${MAIL_FROM:${spring.mail.username:}}

# WISH-02 AI 추천 (Claude API). 키는 git에 넣지 말고 환경변수로. 없으면 기본 추천 문구를 씁니다.
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
