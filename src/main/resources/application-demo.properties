# demo 프로필 (서버 배포용, 단디톤 시연). 시간 이동 API(DemoController)가 켜지고, 개발용 로그인은 꺼집니다.

# 웹 앱 주소만 허용 (EAS Hosting 운영 주소와 미리보기 주소)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://han-gajiman.github.io,https://han-gajiman.expo.app,https://han-gajiman--*.expo.app}

# Caddy(HTTPS) 뒤에서 실제 접속 IP를 받습니다. (계정 찾기 횟수 제한이 IP 기준)
server.forward-headers-strategy=framework

# 서명 키는 기본값 없이 환경변수로만. 빠뜨리면 서버가 뜨지 않습니다. (저장소가 공개라 기본값으로는 토큰을 위조할 수 있음)
jwt.secret=${JWT_SECRET}

# DEMO-01 시간 이동: 실서버는 허용한 계정들만 한 묶음으로 함께 이동 (쉼표로 여러 개, 11/10 시연 계정 + 친구 계정)
demo.time-travel.enabled=true
demo.time-travel.user-emails=${DEMO_TIME_TRAVEL_EMAILS:demo@hangajiman.app,friend@hangajiman.app}
