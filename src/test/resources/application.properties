spring.application.name=backend

# 테스트는 개발 DB와 분리된 hangajiman_test를 씁니다.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/hangajiman_test}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

jwt.secret=test-secret-key-for-jwt-at-least-32-bytes!!
jwt.access-exp-seconds=1800
jwt.refresh-exp-days=14

# 테스트에서는 카카오·Google 클라이언트를 가짜(MockBean)로 바꿉니다.
kakao.api-base-url=https://kapi.kakao.com
kakao.admin-key=test-admin-key
google.tokeninfo-url=https://oauth2.googleapis.com/tokeninfo
google.client-ids=test-client-id.apps.googleusercontent.com

friend.invite-base-url=https://test.hangajiman.app
expo.push-url=https://exp.host/--/api/v2/push/send
